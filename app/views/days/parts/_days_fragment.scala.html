@import lib._
@import play.api.libs.json._

@table(classExt="indent") {
  @iconrow(humanity_icon()) {
    <strong id="days">Герои и события</strong>, которые мы хотели бы помнить и которые для нас важнее
    официальных дат
  }
}

<div data-days-container="rotate">
  <div class="d-table ms-5" data-days-list></div>

  <template data-days-row-template>
    @iconrow(dove_icon()) {
      <span class="day-title"><a href="#" class="dotted"></a><span class="day-desc"></span></span><span class="age-wrap"> — <strong class="text-nowrap age-str"></strong></span>
    }
  </template>

  <script type="application/json" data-days-records>@Html(Json.stringify(JsArray(Days.sortedDays.map { day =>
    Json.obj(
      "href" -> day.href,
      "title" -> day.dayTitle,
      "desc" -> day.desc,
      "dates" -> day.dates.map(_.toString),
      "year" -> day.yearOpt
    )
  })).replace("</", "<\\/"))</script>
</div>
