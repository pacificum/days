@import lib._
@import play.api.libs.json._

@table() {
  @iconrow(humanity_icon()) {
    <strong id="years">Истории,</strong> которые нас вдохновляют
  }
}

<div data-days-container="static">
  <div class="d-table ms-5" data-days-list></div>

  <template data-days-row-template>
    @iconrow(dove_icon()) {
      <span class="day-title"><a href="#" class="dotted"></a><span class="day-desc"></span></span><span class="age-wrap"> — <strong class="age-str"></strong></span>
    }
  </template>

  <script type="application/json" data-days-records>@Html(Json.stringify(JsArray(Days.records.filterNot(_.hasDate).map { record =>
    Json.obj(
      "href" -> record.href,
      "title" -> record.dayTitle,
      "desc" -> record.desc,
      "dates" -> Seq.empty[String],
      "year" -> record.yearOpt
    )
  })).replace("</", "<\\/"))</script>
</div>
