@(title: String, extras: Html*)(content: Html)
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="yandex-verification" content="fcab46507eb3fffe" />
  <title>@title</title>
  <link rel="shortcut icon" type="image/png" href="@routes.Assets.at("icons/favicon.png")">

  <!-- bootstrap-5.3.3 -->
  <link rel="stylesheet" href="@routes.Assets.at("bootstrap/css/bootstrap.min.css")">
  <link rel="stylesheet" href="@routes.Assets.at("lib/font-awesome/css/all.min.css")">
  <script src="@routes.Assets.at("bootstrap/js/bootstrap.min.js")" type="text/javascript" ></script>
  <script src="@routes.Assets.at("lib/jquery/jquery.min.js")" type="text/javascript"></script>
  <script src="@routes.Assets.at("js/main.js")" type="text/javascript" ></script>
  <link rel="stylesheet" href="@routes.Assets.at("css/main.css")">
</head>
<body>
  @content
  @for(extra<-extras) {
    @extra
  }
</body>
</html>
